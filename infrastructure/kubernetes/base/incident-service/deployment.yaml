apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-service
  namespace: aegisops-system
  labels:
    app.kubernetes.io/name: incident-service
    app.kubernetes.io/part-of: aegisops
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-service
        app.kubernetes.io/part-of: aegisops
        app.kubernetes.io/component: backend
    spec:
      # The incident service never calls the Kubernetes API - it only
      # talks to MySQL and Kafka - so it gets no ServiceAccount token,
      # unlike cluster-agent (see base/cluster-agent).
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 100 # `aegisops` in the image - see Dockerfile
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: incident-service
          image: aegisops/incident-service:dev
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: incident-service-config

          env:
            - name: AEGISOPS_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: aegisops-secrets
                  key: MYSQL_USER
            - name: AEGISOPS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegisops-secrets
                  key: MYSQL_PASSWORD

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1
              memory: 768Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # /actuator/health aggregates DB + Kafka connectivity, which is
          # exactly what should gate first-time startup. Liveness and
          # readiness use the narrower groups Spring Boot Actuator already
          # exposes (confirmed via `curl /actuator/health` -> {"groups":
          # ["liveness","readiness"], ...}) so a transient MySQL/Kafka
          # blip affects routing (readiness), not a pod kill (liveness).
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 24 # ~2 minutes for JVM start + Flyway migration

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: tmp
          emptyDir: {}
