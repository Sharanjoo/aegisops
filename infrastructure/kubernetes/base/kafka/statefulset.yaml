# Development-only, single-broker Kafka in KRaft mode (no ZooKeeper). One
# node acting as both broker and controller - not a replicated, HA event
# broker. A real deployment would point at a managed or properly
# replicated Kafka cluster instead of this StatefulSet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: aegisops-system
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: aegisops
    app.kubernetes.io/component: event-broker
    app.kubernetes.io/managed-by: kustomize
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: aegisops
        app.kubernetes.io/component: event-broker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60

      securityContext:
        # apache/kafka:4.3.1 already defaults to a non-root `appuser`
        # (verified via `docker run --entrypoint id`), but the image sets
        # USER to that non-numeric name rather than a UID, and the
        # kubelet cannot verify runAsNonRoot against a non-numeric user -
        # it fails every container with CreateContainerConfigError
        # ("cannot verify user is non-root") unless runAsUser is given
        # explicitly. 1000:1000 matches appuser's actual uid/gid, and
        # /var/lib/kafka/data is already owned by appuser in the image.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 29093

          envFrom:
            - configMapRef:
                name: kafka-config

          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Matches infrastructure/local/compose.yaml's Kafka healthcheck
          # command, generous on first-run because KRaft storage
          # formatting happens once at first startup. This is the only
          # probe that actually exercises the admin API end-to-end -
          # appropriate for a one-time startup gate.
          startupProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-topics.sh
                - --bootstrap-server
                - localhost:9092
                - --list
            periodSeconds: 5
            timeoutSeconds: 10 # kafka-topics.sh itself is a JVM launch - 1s (the exec-probe default) isn't enough
            failureThreshold: 48 # ~4 minutes

          # readiness/liveness deliberately use a plain TCP check instead
          # of kafka-topics.sh: that CLI launches its own JVM per
          # invocation, and running that every 10-20s made the broker
          # flap under ordinary local scheduling jitter (observed:
          # repeated "command timed out after 10s" -> failed liveness ->
          # restart, with no actual resource pressure on the node). A
          # closed/refused socket on the broker port still reliably
          # catches a crashed or hung broker.
          readinessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: tmp
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: kafka
          app.kubernetes.io/part-of: aegisops
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard # kind's default StorageClass (rancher.io/local-path)
        resources:
          requests:
            storage: 2Gi
