# Development-only local observability - not a production monitoring
# stack. Single instance, 6-hour retention, data on an emptyDir (see
# volumes below): a pod restart or reschedule loses all scraped history.
# Reachable only via `kubectl port-forward` - no ingress, no external
# exposure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aegisops-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: aegisops
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: aegisops
        app.kubernetes.io/component: observability
    spec:
      # Static in-cluster targets only (see configmap.yaml) - Prometheus
      # never calls the Kubernetes API here, so no ServiceAccount token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534 # `nobody` in the official image - see Dockerfile upstream
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          imagePullPolicy: IfNotPresent

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h

          ports:
            - name: http
              containerPort: 9090

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            # Scrape history only - explicitly not persistent (see the
            # top-level comment). A real deployment would use a PVC.
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 24 # ~2 minutes for first-run WAL setup

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
