apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: aegisops-system
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: aegisops
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: aegisops
        app.kubernetes.io/component: frontend
    spec:
      # Serves static assets and reverse-proxies to other in-cluster
      # Services - never calls the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # `nginx` in nginxinc/nginx-unprivileged - see Dockerfile
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: dashboard
          image: aegisops/dashboard:dev
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: dashboard-config

          volumeMounts:
            # nginx-unprivileged's own nginx.conf already redirects pid
            # and all temp_path directives under /tmp (verified via
            # `docker run --entrypoint sh ... cat /etc/nginx/nginx.conf`).
            - name: tmp
              mountPath: /tmp
            # envsubst renders nginx.conf.template's output here at
            # container start (see 20-envsubst-on-templates.sh in the
            # base image) - this is the one path under /etc that must
            # stay writable for a read-only root filesystem to work.
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 10

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf-d
          emptyDir: {}
