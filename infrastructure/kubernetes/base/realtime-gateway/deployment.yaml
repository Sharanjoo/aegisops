apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-gateway
  namespace: aegisops-system
  labels:
    app.kubernetes.io/name: realtime-gateway
    app.kubernetes.io/part-of: aegisops
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realtime-gateway
        app.kubernetes.io/part-of: aegisops
        app.kubernetes.io/component: backend
    spec:
      # Only talks to Kafka and WebSocket clients, never the Kubernetes
      # API - no ServiceAccount token, same reasoning as incident-service.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # `node` in the image - see Dockerfile
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: realtime-gateway
          image: aegisops/realtime-gateway:dev
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081

          envFrom:
            - configMapRef:
                name: realtime-gateway-config

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12 # ~1 minute for Kafka consumer join

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: tmp
          emptyDir: {}
