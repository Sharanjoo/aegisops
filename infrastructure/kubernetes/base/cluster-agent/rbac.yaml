apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-agent
  namespace: aegisops-system
  labels:
    app.kubernetes.io/name: cluster-agent
    app.kubernetes.io/part-of: aegisops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegisops-cluster-agent
  labels:
    app.kubernetes.io/name: cluster-agent
    app.kubernetes.io/part-of: aegisops
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegisops-cluster-agent
  labels:
    app.kubernetes.io/name: cluster-agent
    app.kubernetes.io/part-of: aegisops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aegisops-cluster-agent
subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: aegisops-system