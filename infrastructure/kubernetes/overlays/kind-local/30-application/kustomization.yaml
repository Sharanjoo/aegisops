apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stage 4 of the deployment order: incident-service, realtime-gateway,
# dashboard, and cluster-agent - all depend on MySQL/Kafka (and, for
# realtime-gateway/dashboard, on the incident-events topic) already
# existing.
resources:
  - ../../../base/incident-service
  - ../../../base/realtime-gateway
  - ../../../base/dashboard
  - ../../../base/cluster-agent
