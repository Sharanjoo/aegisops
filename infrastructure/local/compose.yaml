name: aegisops-local

services:
  mysql:
    image: mysql:8.4
    container_name: aegisops-mysql
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3307:3306"

    volumes:
      - aegisops-mysql-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: aegisops-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # The three services below are optional: this compose file's original
  # purpose (starting MySQL and Kafka for a natively-run `mvnw`/`npm run
  # dev`) still works unchanged. They exist for running the full stack as
  # containers - `docker compose -f infrastructure/local/compose.yaml up`
  # - see the README links below for image build commands and the
  # standalone `docker run` form.
  incident-service:
    build:
      context: ../../services/incident-service
    image: aegisops/incident-service:dev
    container_name: aegisops-incident-service
    restart: unless-stopped
    stop_grace_period: 25s

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      # Internal Docker-network addresses - see services/incident-service/README.md.
      AEGISOPS_DB_URL: jdbc:mysql://mysql:3306/aegisops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      AEGISOPS_DB_USERNAME: ${MYSQL_USER}
      AEGISOPS_DB_PASSWORD: ${MYSQL_PASSWORD}
      AEGISOPS_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AEGISOPS_CORS_ALLOWED_ORIGIN: http://localhost:8090

  realtime-gateway:
    build:
      context: ../../services/realtime-gateway
    image: aegisops/realtime-gateway:dev
    container_name: aegisops-realtime-gateway
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8081:8081"

    environment:
      AEGISOPS_KAFKA_BROKERS: kafka:19092

  dashboard:
    build:
      context: ../../apps/dashboard
    image: aegisops/dashboard:dev
    container_name: aegisops-dashboard
    restart: unless-stopped

    depends_on:
      - incident-service
      - realtime-gateway

    # Mapped to a different host port than incident-service's 8080 - the
    # container itself still listens on 8080 internally.
    ports:
      - "8090:8080"

    environment:
      AEGISOPS_INCIDENT_SERVICE_URL: http://incident-service:8080
      AEGISOPS_REALTIME_GATEWAY_URL: http://realtime-gateway:8081

volumes:
  aegisops-mysql-data: