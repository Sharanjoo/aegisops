spring.application.name=incident-service

spring.datasource.url=${AEGISOPS_DB_URL:jdbc:mysql://localhost:3307/aegisops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${AEGISOPS_DB_USERNAME:aegisops}
spring.datasource.password=${AEGISOPS_DB_PASSWORD:}

spring.kafka.bootstrap-servers=${AEGISOPS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

aegisops.kafka.topics.incident-events=${AEGISOPS_INCIDENT_EVENTS_TOPIC:aegisops.incident.events.v1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

aegisops.outbox.publish-interval-ms=${AEGISOPS_OUTBOX_PUBLISH_INTERVAL_MS:1000}

aegisops.cors.allowed-origin=${AEGISOPS_CORS_ALLOWED_ORIGIN:http://localhost:5173}