name: Realtime Gateway CI

on:
  pull_request:
    paths:
      - "services/realtime-gateway/**"
      - ".github/workflows/realtime-gateway-ci.yml"

  push:
    branches:
      - main
    paths:
      - "services/realtime-gateway/**"
      - ".github/workflows/realtime-gateway-ci.yml"

permissions:
  contents: read

concurrency:
  group: realtime-gateway-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript Tests and Container Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/realtime-gateway

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: services/realtime-gateway/.nvmrc
          cache: npm
          cache-dependency-path: services/realtime-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build container image
        run: |
          docker build \
            --tag aegisops/realtime-gateway:ci \
            .