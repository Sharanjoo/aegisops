name: E2E Kind CI

# Builds every application image, deploys the full stack into an ephemeral
# kind cluster (created fresh in this job and always torn down), then runs
# verify-kind.ps1 and the automated E2E test against it. Unit tests are
# already covered by each service's own CI workflow - this job does not
# repeat them, only what an isolated cluster deployment actually needs.
on:
  pull_request:
    paths:
      - "services/**"
      - "apps/**"
      - "infrastructure/kubernetes/**"
      - "infrastructure/scripts/**"
      - "infrastructure/kind/**"
      - ".github/workflows/e2e-kind-ci.yml"

  push:
    branches:
      - main
    paths:
      - "services/**"
      - "apps/**"
      - "infrastructure/kubernetes/**"
      - "infrastructure/scripts/**"
      - "infrastructure/kind/**"
      - ".github/workflows/e2e-kind-ci.yml"

  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-kind-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: aegisops-dev
  # kind's own published binary + checksum (kubernetes-sigs/kind releases) -
  # avoids a third-party setup action for a single-binary install.
  KIND_VERSION: v0.33.0
  KIND_LINUX_AMD64_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  KUBECTL_VERSION: v1.37.0

jobs:
  e2e:
    name: Deploy to kind and run E2E test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/incident-service/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: services/realtime-gateway/.nvmrc

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/cluster-agent/go.mod
          cache: true
          cache-dependency-path: services/cluster-agent/go.sum

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install kind
        run: |
          set -euo pipefail
          curl -sSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_LINUX_AMD64_SHA256}  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: Create ephemeral kind cluster
        run: |
          kind create cluster \
            --name "${CLUSTER_NAME}" \
            --config infrastructure/kind/cluster.yaml \
            --wait 120s

      - name: Generate ephemeral CI-only database credentials
        shell: pwsh
        run: |
          # CI-only, discarded with the cluster at the end of this job -
          # never a repository secret, never used outside this ephemeral
          # cluster's lifetime.
          function New-RandomSecret {
            $bytes = New-Object byte[] 24
            [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
            [Convert]::ToBase64String($bytes) -replace '[^a-zA-Z0-9]', ''
          }

          $mysqlPassword = New-RandomSecret
          $mysqlRootPassword = New-RandomSecret

          # Registers the mask BEFORE the values reach any log line.
          Write-Host "::add-mask::$mysqlPassword"
          Write-Host "::add-mask::$mysqlRootPassword"

          Add-Content -Path $env:GITHUB_ENV -Value "MYSQL_DATABASE=aegisops"
          Add-Content -Path $env:GITHUB_ENV -Value "MYSQL_USER=aegisops"
          Add-Content -Path $env:GITHUB_ENV -Value "MYSQL_PASSWORD=$mysqlPassword"
          Add-Content -Path $env:GITHUB_ENV -Value "MYSQL_ROOT_PASSWORD=$mysqlRootPassword"

      - name: Deploy the AegisOps stack (deploy-kind.ps1)
        shell: pwsh
        run: pwsh infrastructure/scripts/deploy-kind.ps1 -ClusterName $env:CLUSTER_NAME

      - name: Verify the deployment (verify-kind.ps1)
        shell: pwsh
        run: pwsh infrastructure/scripts/verify-kind.ps1

      - name: Run the automated E2E test
        shell: pwsh
        run: pwsh infrastructure/scripts/e2e-kind.ps1 -ClusterName $env:CLUSTER_NAME

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: .e2e-diagnostics/
          retention-days: 7

      - name: Delete ephemeral kind cluster
        if: always()
        run: kind delete cluster --name "${CLUSTER_NAME}" || true
